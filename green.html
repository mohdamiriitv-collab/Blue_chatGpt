<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Experimental Interface (Green)</title>
    <style>
        /* [CSS remains exactly the same as the previous version for visual consistency] */
        :root {
            --sidebar-bg: #143621;
            --sidebar-hover: #1e4d30;
            --sidebar-text: #e8f5e9;
            --main-bg: #f2fbf5;
            --chat-user-bg: #c8e6c9;
            --chat-ai-bg: transparent;
            --text-primary: #1b1b1b;
            --text-secondary: #4a4a4a;
            --border-color: #a5d6a7;
            --input-bg: #ffffff;
            --button-bg: #2e7d32;
            --button-hover: #1b5e20;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { display: flex; height: 100vh; background-color: var(--main-bg); color: var(--text-primary); }
        
        .sidebar { width: 260px; background-color: var(--sidebar-bg); color: var(--sidebar-text); display: flex; flex-direction: column; padding: 10px; }
        .new-chat-btn { background-color: transparent; border: 1px solid rgba(255, 255, 255, 0.2); color: var(--sidebar-text); padding: 12px; border-radius: 6px; text-align: left; cursor: pointer; font-size: 14px; margin-bottom: 20px; }
        .history-list { flex: 1; overflow-y: auto; font-size: 13px; }
        .history-item { padding: 10px; margin-bottom: 5px; border-radius: 6px; cursor: pointer; color: #b9d8c2; }
        
        .main-content { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-container { flex: 1; overflow-y: auto; padding: 2rem 0; display: flex; flex-direction: column; align-items: center; scroll-behavior: smooth; }
        
        .message-wrapper { width: 100%; display: flex; justify-content: center; padding: 24px 20px; border-bottom: 1px solid rgba(165, 214, 167, 0.3); }
        .message-wrapper.ai { background-color: rgba(200, 230, 201, 0.2); }
        .message-content { width: 100%; max-width: 768px; display: flex; gap: 20px; line-height: 1.6; font-size: 16px; }
        
        .avatar { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 14px; }
        .avatar.user { background-color: var(--button-bg); color: white; }
        .avatar.ai { background-color: #10a37f; color: white; }
        .text-body { flex: 1; color: var(--text-primary); }
        
        .input-container { width: 100%; max-width: 800px; margin: 0 auto; padding: 20px; background: linear-gradient(180deg, rgba(242,251,245,0) 0%, var(--main-bg) 50%); }
        .input-box { position: relative; display: flex; align-items: center; background-color: var(--input-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); padding: 10px 15px; }
        .input-box input { flex: 1; border: none; outline: none; font-size: 16px; padding: 10px; background: transparent; color: var(--text-primary); }
        .send-btn { background-color: var(--button-bg); color: white; border: none; border-radius: 6px; padding: 8px 16px; cursor: pointer; transition: background-color 0.2s; font-weight: bold;}
        .send-btn:hover { background-color: var(--button-hover); }
        .send-btn:disabled { background-color: #9e9e9e; cursor: not-allowed; }
        
        .disclaimer { text-align: center; font-size: 12px; color: var(--text-secondary); margin-top: 10px; }

        /* Typing Indicator Animation */
        .typing-indicator { display: none; font-style: italic; color: var(--text-secondary); font-size: 14px; }
        .typing-indicator span { animation: blink 1.4s infinite both; }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink { 0% { opacity: 0.2; } 20% { opacity: 1; } 100% { opacity: 0.2; } }

        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="new-chat-btn"><span>+</span> New Chat</button>
        <div class="history-list">
            <div class="history-item">Educational Interface Study</div>
        </div>
    </aside>

    <main class="main-content">
        <div class="chat-container" id="chat-box">
            <div class="message-wrapper ai">
                <div class="message-content">
                    <div class="avatar ai">AI</div>
                    <div class="text-body">
                        <p>Hello. I am ready to assist you with your learning task today. Please ask me a question about the impact of technology on modern education to begin.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-container">
            <div class="typing-indicator" id="typing-status">AI is generating a response<span>.</span><span>.</span><span>.</span></div>
            <div class="input-box">
                <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
                <button class="send-btn" id="send-btn">Send</button>
            </div>
            <div class="disclaimer">
                Experiment Module: Interaction data is anonymized.
            </div>
        </div>
    </main>

    <script>
        // Standardized array of responses to ensure controlled text exposure
        const experimentalScript = [
            "Technology has fundamentally shifted educational paradigms by enabling asynchronous learning. This allows students to process complex information at their own pace, which cognitive load theory suggests improves overall retention and reduces working memory strain.",
            "Furthermore, interactive user interfaces play a crucial role in engagement. Research indicates that aesthetic appeal and layout clarity can significantly lower barriers to entry for complex subjects, fostering a state of 'flow' or deep cognitive focus during study sessions.",
            "However, digital learning environments also introduce challenges, such as digital eye strain. Prolonged exposure to screens without adequate visual breaks can lead to perceived visual fatigue, which negatively impacts a student's ability to maintain sustained attention over time.",
            "To mitigate these effects, educational designers often employ specific color palettes and contrast ratios. The goal is to balance visual stimulation—which keeps the learner awake and engaged—with visual comfort to prolong the duration of effective study.",
            "Thank you for participating in this interaction. This concludes the text generation for this specific experimental task. Please proceed to the next step of your survey."
        ];

        let currentScriptIndex = 0;

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingStatus = document.getElementById('typing-status');

        function scrollToBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function addUserMessage(message) {
            const userHtml = `
                <div class="message-wrapper">
                    <div class="message-content">
                        <div class="avatar user">U</div>
                        <div class="text-body"><p>${message}</p></div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', userHtml);
            scrollToBottom();
        }

        function addAIMessage(message) {
            const aiHtml = `
                <div class="message-wrapper ai">
                    <div class="message-content">
                        <div class="avatar ai">AI</div>
                        <div class="text-body"><p>${message}</p></div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', aiHtml);
            scrollToBottom();
        }

        function handleSend() {
            const text = userInput.value.trim();
            if (text === '') return;

            // 1. Add user message
            addUserMessage(text);
            
            // 2. Clear input and disable button
            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;
            
            // 3. Show typing indicator
            typingStatus.style.display = 'block';
            
            // 4. Simulate AI processing time (1.5 seconds)
            setTimeout(() => {
                typingStatus.style.display = 'none';
                
                // Fetch next scripted response, or a default loop if array ends
                let responseText = "";
                if (currentScriptIndex < experimentalScript.length) {
                    responseText = experimentalScript[currentScriptIndex];
                    currentScriptIndex++;
                } else {
                    responseText = "The experimental task is complete. Please return to the main survey window to record your experiences.";
                }

                // Add AI response
                addAIMessage(responseText);

                // Re-enable input
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();

            }, 1500); // 1500 milliseconds = 1.5 seconds delay
        }

        // Event Listeners
        sendBtn.addEventListener('click', handleSend);
        
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                handleSend();
            }
        });
    </script>
</body>
</html>
