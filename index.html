<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Study</title>

<style>
    body {
        margin: 0;
        font-family: Arial;
        background: #0f172a;
        color: white;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .box {
        text-align: center;
        background: #111827;
        padding: 40px;
        border-radius: 12px;
    }

    button {
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        background: #374151;
        color: white;
        cursor: pointer;
    }
</style>
</head>

<body>

<div class="box">
    <h2>AI Interaction Study</h2>
    <p>Click below to begin</p>
    <button onclick="start()">Start</button>
</div>

<script>
function start() {
    let group = Math.random() < 0.5 ? "blue" : "green";

    // store for analysis
    localStorage.setItem("group", group);

    // redirect
    if (group === "blue") {
        window.location.href = "blue.html";
    } else {
        window.location.href = "green.html";
    }
}
</script>

</body>
</html>
